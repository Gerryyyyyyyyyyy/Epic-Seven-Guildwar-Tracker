[package]
name = "e7-gw-tracker"
version = "0.1.0"
description = "Epic Seven Guild War Tracker"
authors = ["G R"]
edition = "2021"

[lib]
name = "e7_gw_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
