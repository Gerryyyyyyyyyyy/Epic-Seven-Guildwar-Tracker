name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./e7-gw-tracker-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: e7-gw-tracker-windows
          path: |
            e7-gw-tracker-tauri/src-tauri/target/release/bundle/nsis/*.exe
            e7-gw-tracker-tauri/src-tauri/target/release/*.exe
